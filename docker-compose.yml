version: "3.8"

services:
  postgres:
    image: postgres:15
    env_file:
      - .env
    environment:
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_POSTGRES_DSN: postgres://postgres:postgres@postgres:5432/rates?sslmode=disable
      APP_GRPC_PORT: "9001"
      APP_METRICS_PORT: "9090"
      APP_ASK_METHOD: topN
      APP_ASK_N: "1"
      APP_BID_METHOD: topN
      APP_BID_N: "1"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "9001:9001"
      - "9090:9090"
    restart: on-failure

volumes:
  pgdata:
